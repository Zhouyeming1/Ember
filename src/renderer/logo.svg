<svg xmlns="http://www.w3.org/2000/svg" width="174" height="100" viewBox="0 0 174 100">
  <!-- 界面小 logo：实心小猫居中（棕色主体 + 米色五官），外圈留白撑出横向画布 -->
  <g transform="translate(87 50) scale(0.13) translate(-543 -503.5)">

    <!-- 尾巴（先画，藏在身体后） -->
    <path d="M 700 700 C 920 706 940 540 872 468 C 846 440 810 458 840 502"
          fill="none" stroke="#8A6F5A" stroke-width="72" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="512" cy="672" rx="296" ry="186" fill="#8A6F5A"/>
    <!-- 耳朵 -->
    <polygon points="340,320 296,150 480,262" fill="#8A6F5A"/>
    <polygon points="684,320 728,150 544,262" fill="#8A6F5A"/>
    <!-- 头 -->
    <circle cx="512" cy="430" r="212" fill="#8A6F5A"/>
    <!-- 内耳（米色小三角） -->
    <polygon points="356,232 342,196 410,224" fill="#F2E9E1"/>
    <polygon points="668,232 682,196 614,224" fill="#F2E9E1"/>
    <!-- 眼睛（米色大圆 + 棕瞳孔 + 高光） -->
    <circle cx="442" cy="464" r="52" fill="#F2E9E1"/>
    <circle cx="582" cy="464" r="52" fill="#F2E9E1"/>
    <circle cx="456" cy="484" r="25" fill="#8A6F5A"/>
    <circle cx="568" cy="484" r="25" fill="#8A6F5A"/>
    <circle cx="446" cy="474" r="8" fill="#F2E9E1"/>
    <circle cx="558" cy="474" r="8" fill="#F2E9E1"/>
    <!-- 鼻子 + 小嘴 -->
    <path d="M 490 572 L 534 572 L 512 596 Z" fill="#F2E9E1"/>
    <path d="M 470 598 Q 512 640 554 598" fill="none" stroke="#F2E9E1" stroke-width="16" stroke-linecap="round"/>
    <!-- 胡须（棕，横向伸出脸颊） -->
    <g fill="none" stroke="#8A6F5A" stroke-width="12" stroke-linecap="round">
      <path d="M 330 500 L 150 486"/>
      <path d="M 330 532 L 156 534"/>
      <path d="M 694 500 L 874 486"/>
      <path d="M 694 532 L 868 534"/>
    </g>
  
  </g>
</svg>
